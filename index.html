<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bible Adventures</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTIiIGZpbGw9IiM3ZWM4ZmYiLz48cmVjdCB5PSIzOCIgd2lkdGg9IjY0IiBoZWlnaHQ9IjI2IiBmaWxsPSIjNTdjNDVlIi8+PGNpcmNsZSBjeD0iNDgiIGN5PSIxOCIgcj0iOCIgZmlsbD0iI2ZmZTE0ZCIvPjwvc3ZnPg==">
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Avenir Next", system-ui, sans-serif;
    background: #7ec8ff; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- In-game HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
  body.playing #hud { display: block; }
  #goal { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.92); color: #223; font-weight: 800; font-size: 18px;
    padding: 10px 20px; border-radius: 20px; box-shadow: 0 5px 16px rgba(0,0,0,.25);
    text-align: center; max-width: 90vw; }
  #goalSub { display:block; font-size: 13px; font-weight: 700; color: #2a7de8; margin-top: 2px; }
  #backBtn { position: absolute; top: 12px; left: 12px; pointer-events: auto; cursor: pointer;
    border: none; font-family: inherit; font-weight: 800; font-size: 15px; color: #fff;
    background: rgba(0,0,0,.35); padding: 10px 14px; border-radius: 16px; }
  #backBtn:active { transform: scale(.94); }
  #timer { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.4); color:#fff;
    font-weight: 900; font-size: 20px; padding: 8px 14px; border-radius: 16px; display: none; }
  #timer.warn { background: #e8402a; animation: tPulse .6s ease-in-out infinite; }
  @keyframes tPulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.12);} }
  #popCheer { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%) scale(.5);
    font-weight: 900; font-size: 42px; color:#fff; text-shadow: 0 3px 0 #ff8c1a, 0 6px 14px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; white-space: nowrap; }
  #popCheer.show { animation: cheerPop 1.1s ease-out; }
  @keyframes cheerPop { 0%{ opacity:0; transform: translate(-50%,-50%) scale(.4);} 20%{ opacity:1; transform: translate(-50%,-50%) scale(1.15);} 70%{ opacity:1; transform: translate(-50%,-60%) scale(1);} 100%{ opacity:0; transform: translate(-50%,-90%) scale(1);} }

  /* Virtual joystick */
  #stick { position: absolute; left: 26px; bottom: 26px; width: 130px; height: 130px;
    border-radius: 50%; background: rgba(255,255,255,.22); border: 3px solid rgba(255,255,255,.5);
    pointer-events: auto; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px;
    border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 4px 10px rgba(0,0,0,.3); }
  #stickHint { position: absolute; left: 30px; bottom: 162px; color: #fff; font-weight: 800; font-size: 13px;
    text-shadow: 0 2px 5px rgba(0,0,0,.5); background: rgba(0,0,0,.25); padding: 5px 10px; border-radius: 12px; }

  /* Buddy speech bubble */
  #say { position: absolute; right: 14px; top: 64px; max-width: 210px; pointer-events: none;
    background: #fff; color: #223; font-weight: 700; font-size: 14px; padding: 10px 14px;
    border-radius: 16px; box-shadow: 0 6px 16px rgba(0,0,0,.25); opacity: 0; transition: opacity .3s; }
  #say.show { opacity: 1; }

  /* ---------- Menu screens ---------- */
  .screen { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center;
    overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 16px 40px;
    background: linear-gradient(180deg, #8fd0ff 0%, #a7e0c0 100%); }
  .screen.show { display: flex; }
  .bigTitle { font-size: 40px; font-weight: 900; color: #fff; text-align: center; margin: 10px 0 2px;
    text-shadow: 0 4px 0 #ffb43d, 0 8px 14px rgba(0,0,0,.3); letter-spacing: .5px; }
  .subTitle { font-size: 16px; color: #17506b; font-weight: 700; text-align: center; margin: 0 0 16px; }

  .playBtn { border: none; cursor: pointer; font-family: inherit; font-weight: 900; color: #fff;
    font-size: 26px; padding: 18px 46px; border-radius: 26px;
    background: linear-gradient(160deg, #4bd15e, #2ba341); box-shadow: 0 8px 0 #1f7d33, 0 12px 22px rgba(0,0,0,.3);
    margin: 10px 0; transition: transform .08s; }
  .playBtn:active { transform: translateY(3px); box-shadow: 0 5px 0 #1f7d33, 0 8px 16px rgba(0,0,0,.3); }

  #ages { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 6px 0 4px; }
  .ageChip { border: none; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 15px;
    color: #17506b; background: rgba(255,255,255,.75); padding: 9px 15px; border-radius: 16px; }
  .ageChip.sel { background: #ffd21a; color: #6a4a00; box-shadow: 0 3px 0 #c99e00; }
  #ageLabel { color:#17506b; font-weight:800; font-size:14px; margin-top:6px; }
  #nameInput { font-family: inherit; font-weight: 800; font-size: 18px; color:#17506b; text-align: center;
    border: 3px solid #fff; background: rgba(255,255,255,.9); border-radius: 16px; padding: 11px 16px;
    margin: 12px 0 4px; width: 240px; max-width: 80vw; outline: none; box-shadow: 0 4px 10px rgba(0,0,0,.15); }
  #nameInput:focus { border-color: #ffd21a; }
  #nameInput::placeholder { color:#8fb0c4; font-weight:700; }

  /* Mission cards */
  #missionList { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .mCard { display: flex; align-items: center; gap: 14px; border: none; cursor: pointer; text-align: left;
    font-family: inherit; background: #fff; border-radius: 20px; padding: 12px 16px;
    box-shadow: 0 6px 14px rgba(0,0,0,.2); transition: transform .08s; }
  .mCard:active { transform: scale(.98); }
  .mCard.locked { opacity: .55; cursor: not-allowed; }
  .mIcon { width: 60px; height: 60px; flex: 0 0 60px; border-radius: 16px; display: flex; align-items: center;
    justify-content: center; font-size: 34px; background: linear-gradient(160deg, #7ec8ff, #4f9fda); }
  .mCard.done .mIcon { background: linear-gradient(160deg, #4bd15e, #2ba341); }
  .mCard.locked .mIcon { background: #9aa6b8; }
  .mBody { flex: 1; }
  .mName { font-size: 18px; font-weight: 800; color: #223; }
  .mGoalTxt { font-size: 13px; color: #667; margin-top: 1px; }
  .mStars { font-size: 15px; margin-top: 2px; }
  #topBar { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .topBtn { border: none; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 15px; color: #fff;
    background: rgba(0,0,0,.25); padding: 9px 14px; border-radius: 14px; }
  #voiceChip { }

  /* Win card */
  #winCard { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: rgba(10,20,40,.55); padding: 16px; }
  #winCard.show { display: flex; }
  .winInner { background: #fff; border-radius: 26px; padding: 22px 20px; max-width: 420px; width: 100%;
    text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
  .winH { font-size: 26px; font-weight: 900; color: #2ba341; }
  #winStars { font-size: 46px; letter-spacing: 4px; margin: 4px 0; display:inline-block; transition: transform .15s; }
  #winName { font-size: 20px; font-weight: 800; color: #2a7de8; }
  #winVerse { font-size: 15px; font-style: italic; color: #444; margin: 8px 10px; line-height: 1.35; }
  .winRow { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .winBtn { border: none; cursor: pointer; font-family: inherit; font-weight: 800; color: #fff; font-size: 17px;
    padding: 14px 20px; border-radius: 18px; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
  #winNext { background: #4bd15e; box-shadow: 0 5px 0 #2ba341; }
  #winMap { background: #576574; }

  /* Confetti */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  .confetti i { position: absolute; top: 0; width: 11px; height: 15px; opacity: .95; will-change: transform; }

  @media (max-width: 640px) {
    .bigTitle { font-size: 32px; } #goal { font-size: 16px; padding: 8px 14px; }
    #stick { width: 118px; height: 118px; left: 18px; bottom: 20px; }
    #knob { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
  }
</style>
</head>
<body>
<div id="scene"></div>

<!-- In-game HUD -->
<div id="hud">
  <button id="backBtn">◀ Map</button>
  <div id="goal">Goal<span id="goalSub"></span></div>
  <div id="say"></div>
  <div id="stickHint">Drag to move! 🕹️</div>
  <div id="stick"><div id="knob"></div></div>
  <div id="timer"></div>
  <div id="popCheer"></div>
</div>

<!-- Start screen -->
<div class="screen show" id="startScreen">
  <div class="bigTitle">✝️ Bible Adventures</div>
  <div class="subTitle">Explore God's world and live the great Bible stories!</div>
  <div id="ageLabel">Who's playing?</div>
  <div id="ages"></div>
  <input id="nameInput" maxlength="12" placeholder="Type your name…" autocomplete="off" autocapitalize="words" spellcheck="false" />
  <button class="playBtn" id="playBtn">▶ Play</button>
</div>

<!-- Mission map -->
<div class="screen" id="mapScreen">
  <div id="topBar">
    <button class="topBtn" id="mapBack">◀ Back</button>
    <button class="topBtn" id="musicChip">🎵 Music: On</button>
    <button class="topBtn" id="voiceChip">🔊 Voice: On</button>
    <span class="topBtn" id="gemCount" style="background:rgba(0,0,0,.25)">⭐ 0</span>
  </div>
  <div class="bigTitle" style="font-size:30px">🗺️ Pick an Adventure</div>
  <div id="missionList"></div>
</div>

<!-- Win card -->
<div id="winCard"><div class="winInner">
  <div class="winH">🎉 You did it!</div>
  <div id="winStars">⭐⭐⭐</div>
  <div id="winName">Mission</div>
  <div id="winVerse"></div>
  <div class="winRow">
    <button class="winBtn" id="winNext">▶ Next</button>
    <button class="winBtn" id="winMap">🗺️ Map</button>
  </div>
</div></div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
  if (typeof THREE === 'undefined') {
    document.getElementById('startScreen').innerHTML =
      '<div class="bigTitle">😅 Connect to the internet once, then reopen!</div>';
    return;
  }
  const TAU = Math.PI * 2, clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

  // ================= THREE.JS SCENE =================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd0ff);
  scene.fog = new THREE.Fog(0x8fd0ff, 55, 95);
  const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 400);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('scene').appendChild(renderer.domElement);

  const sun = new THREE.DirectionalLight(0xfff4e0, 1.15);
  sun.position.set(30, 50, 20); sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  const sc = 55; sun.shadow.camera.left=-sc; sun.shadow.camera.right=sc;
  sun.shadow.camera.top=sc; sun.shadow.camera.bottom=-sc; sun.shadow.camera.far=140;
  scene.add(sun);
  const hemi = new THREE.HemisphereLight(0xcfeaff, 0x6a9a55, 0.85); scene.add(hemi);
  const ambLight = new THREE.AmbientLight(0xffffff, 0.18); scene.add(ambLight);

  // cloud puffs
  const clouds = new THREE.Group(); scene.add(clouds);
  const cloudGeo = new THREE.SphereGeometry(1, 10, 8);
  const cloudMat = new THREE.MeshLambertMaterial({color:0xffffff});
  function makeCloud(x,y,z,s){
    const g = new THREE.Group();
    [[0,0,0,1.7,1.0],[1.5,-.15,.2,1.15,0.8],[-1.4,-.05,-.2,1.25,0.85],[.3,.45,.4,1.05,0.8],[-.5,.35,.3,0.9,0.7]].forEach(([a,b,c,r,fy])=>{
      const p = new THREE.Mesh(cloudGeo, cloudMat); p.position.set(a,b,c); p.scale.set(r,r*fy,r); g.add(p);
    });
    g.position.set(x,y,z); g.scale.setScalar(s); clouds.add(g);
  }
  for(let i=0;i<7;i++) makeCloud((Math.random()-.5)*120, 28+Math.random()*10, (Math.random()-.5)*120, 1+Math.random());

  // night star field (shown only for night biomes)
  const starField = new THREE.Group(); scene.add(starField); starField.visible=false;
  (function(){ const m=new THREE.MeshBasicMaterial({color:0xffffff}), gg=new THREE.SphereGeometry(.5,6,6);
    for(let i=0;i<70;i++){ const s=new THREE.Mesh(gg,m); const r=95, th=Math.random()*Math.PI*2, ph=0.15+Math.random()*0.6;
      s.position.set(Math.cos(th)*r*Math.cos(ph), 25+Math.sin(ph)*55, Math.sin(th)*r*Math.cos(ph));
      s.scale.setScalar(0.35+Math.random()*0.7); starField.add(s); } })();
  let currentEnv = null;
  function setSky(hex, near, far, night){
    const sky = new THREE.Color(hex);
    scene.background = sky;
    // fog tinted slightly toward the horizon color for a soft, atmospheric gradient feel
    const fogCol = night ? new THREE.Color(hex).lerp(new THREE.Color(0x0a1230), 0.35)
                         : new THREE.Color(hex).lerp(new THREE.Color(0xffffff), 0.28);
    scene.fog = new THREE.Fog(fogCol, near||58, far||105);
    starField.visible = !!night; clouds.visible = !night;
    if(night){
      sun.intensity = 0.45; sun.color.set(0x9db4ff);
      sun.position.set(-24, 46, -14);              // low, cool "moonlight"
      hemi.color.set(0x2a3a66); hemi.groundColor.set(0x141d33); hemi.intensity = 0.7;
      ambLight.color.set(0x9fb0e0); ambLight.intensity = 0.16;
    } else {
      sun.intensity = 1.25; sun.color.set(0xfff2d6); // warm sun
      sun.position.set(34, 52, 22);
      hemi.color.set(0xdbeeff); hemi.groundColor.set(0x74a35a); hemi.intensity = 0.9;
      ambLight.color.set(0xfff4e6); ambLight.intensity = 0.22;
    }
  }

  // ---- block/material helpers ----
  const matCache = {};
  function mat(hex){ return matCache[hex] || (matCache[hex] = new THREE.MeshLambertMaterial({color:hex})); }
  // faceted (flat-shaded) material — for natural low-poly boulders
  const flatMatCache = {};
  function flatMat(hex){ return flatMatCache[hex] || (flatMatCache[hex] = new THREE.MeshLambertMaterial({color:hex, flatShading:true})); }
  const boxGeo = new THREE.BoxGeometry(1,1,1);
  function box(w,h,d,hex,x,y,z){
    const m = new THREE.Mesh(boxGeo, mat(hex)); m.scale.set(w,h,d); m.position.set(x,y,z);
    m.castShadow = true; m.receiveShadow = true; return m;
  }

  // ---- shared ROUNDED geometry library (perf: build once, reuse+scale everywhere) ----
  // used by the creature/human/prop builders below so characters look soft & organic
  // (the whole world is now smooth low-poly — no cubes).
  const geoCache = {};
  function ugeo(key){
    if (geoCache[key]) return geoCache[key];
    let g;
    switch(key){
      case 'sphere':   g = new THREE.SphereGeometry(.5, 16, 12); break;
      case 'capsule':  g = new THREE.CapsuleGeometry(.5, 1, 4, 10); break;
      case 'cone':     g = new THREE.ConeGeometry(.5, 1, 12); break;
      case 'cylinder': g = new THREE.CylinderGeometry(.5, .5, 1, 14); break;
      case 'robe':     g = new THREE.CylinderGeometry(.32, .5, 1, 14); break; // tapered tunic/robe cone
      case 'torus':    g = new THREE.TorusGeometry(.5, .16, 8, 20); break;
      case 'boulder':  g = new THREE.IcosahedronGeometry(.5, 1); break; // faceted low-poly rock
      case 'blob':     g = new THREE.IcosahedronGeometry(.5, 0); break; // chunky 20-face blob
      case 'arc':      g = new THREE.TorusGeometry(.5, .05, 6, 24, Math.PI); break; // half-ring, e.g. a rainbow band
      default:         g = new THREE.SphereGeometry(.5, 10, 8);
    }
    return geoCache[key] = g;
  }
  // generic rounded part: key = geometry name, hex = color, x/y/z = local position,
  // sx/sy/sz = scale (defaults 1), rx/ry/rz = optional rotation
  function part(key,hex,x,y,z,sx,sy,sz,rx,ry,rz){
    const m = new THREE.Mesh(ugeo(key), mat(hex));
    m.position.set(x,y,z);
    m.scale.set(sx==null?1:sx, sy==null?1:sy, sz==null?1:sz);
    if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; if (rz) m.rotation.z = rz;
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  // sphere/blob helper: rx/ry/rz are RADII (unit sphere has radius .5 -> scale = 2*radius)
  function sph(hex,x,y,z,rx,ry,rz){
    return part('sphere',hex,x,y,z, rx*2, (ry==null?rx:ry)*2, (rz==null?rx:rz)*2);
  }
  // vertical capsule "hanging" from a joint: top sits at y=topY, total height h, radius r
  function capsuleHang(hex,x,topY,z,h,r){
    return part('capsule',hex, x, topY-h/2, z, r*2, h/2, r*2);
  }
  // small cone (horn/ear/beak/party-hat shape), tip pointing +Y by default
  function conePart(hex,x,y,z,r,h,rx,ry,rz){
    return part('cone',hex,x,y,z, r*2, h, r*2, rx,ry,rz);
  }
  function pivotAt(x,y,z){ const p = new THREE.Object3D(); p.position.set(x,y,z); return p; }

  // ================= WORLD =================
  const world = new THREE.Group(); scene.add(world);
  let WORLD_R = 26;                     // half-size of the play area (units)
  const decor = new THREE.Group(); world.add(decor);
  const ambient = new THREE.Group(); world.add(ambient);   // persistent living critters (butterflies) — NOT cleared per mission
  let swayers = [];                                        // trees/plants that gently sway in the wind
  const items = new THREE.Group(); world.add(items);
  const critters = new THREE.Group(); world.add(critters);
  const props = new THREE.Group(); world.add(props);

  // ground = one smooth organic disc (flat top at y=0) with softly-varied vertex colors,
  // plus a separate glossy water mesh. No cubes, no visible grid. Themed per biome.
  let ground = null, waterInfo = null, waterMesh = null;
  const groundGroup = new THREE.Group(); world.add(groundGroup);
  function disposeGroup(g){ while(g.children.length){ const c=g.children[0]; g.remove(c); if(c.geometry)c.geometry.dispose(); if(c.material)c.material.dispose(); } }
  function buildGround(){
    disposeGroup(groundGroup); waterMesh = null;
    const env = currentEnv || {};
    const pal = env.ground || [0x62c257,0x57bd50,0x6bcc5f,0x4fae48];
    const wmode = env.water || null, wc = env.waterColor || 0x3aa0e8;
    const pondX = WORLD_R*0.5, pondZ = -WORLD_R*0.5, pondR = wmode==='lake'?9:6;
    const seaZ = WORLD_R*0.42;
    waterInfo = { mode:wmode, pondX, pondZ, pondR, seaZ };

    // --- main ground: big flat plane (y=0), gently color-varied per vertex (soft patches, NO grid) ---
    const R = Math.max(WORLD_R*3.2, 150);
    const gGeo = new THREE.PlaneGeometry(R*2, R*2, 60, 60);
    // plane is in XY; rotate flat so it lies in XZ at y=0 (stays perfectly flat where things walk)
    gGeo.rotateX(-Math.PI/2);
    const pos = gGeo.attributes.position;
    const cols = new Float32Array(pos.count*3);
    const cA = new THREE.Color(), cB = new THREE.Color();
    const base = pal.map(h=>new THREE.Color(h));
    for(let v=0; v<pos.count; v++){
      const x = pos.getX(v), z = pos.getZ(v);
      // smooth pseudo-noise blend between palette tones — soft patches, no squares
      const n = (Math.sin(x*0.16)*Math.cos(z*0.19) + Math.sin((x+z)*0.09) + Math.cos(x*0.05-z*0.07))*0.5;
      let t = (n*0.5 + 0.5); t = Math.min(1, Math.max(0, t));
      const fi = t*(base.length-1), i0 = Math.floor(fi), i1 = Math.min(base.length-1, i0+1);
      cA.copy(base[i0]).lerp(base[i1], fi-i0);
      // darken very slightly toward the far edge for depth
      const edge = Math.min(1, Math.hypot(x,z)/R);
      cA.lerp(cB.copy(cA).multiplyScalar(0.72), edge*0.5);
      cols[v*3]=cA.r; cols[v*3+1]=cA.g; cols[v*3+2]=cA.b;
    }
    gGeo.setAttribute('color', new THREE.BufferAttribute(cols,3));
    const gMesh = new THREE.Mesh(gGeo, new THREE.MeshLambertMaterial({vertexColors:true}));
    gMesh.receiveShadow = true; gMesh.position.y = 0; groundGroup.add(gMesh);
    ground = gMesh;

    // --- distant rolling hills (FAR outside the play area, never walked on) — storybook horizon ---
    const hillMat = new THREE.MeshLambertMaterial({color: base[base.length-1].clone().multiplyScalar(0.82).getHex()});
    const hillGeo = new THREE.SphereGeometry(1, 12, 8);
    for(let i=0;i<11;i++){
      const a = i/11*TAU + Math.random()*0.35, rr = WORLD_R*2.6 + Math.random()*14;
      const hx = Math.cos(a)*rr, hz = Math.sin(a)*rr;
      const h = new THREE.Mesh(hillGeo, hillMat);
      const w = 16+Math.random()*20;
      h.scale.set(w, 5+Math.random()*5, w);
      h.position.set(hx, -2, hz);          // squashed dome sitting on the misty horizon
      groundGroup.add(h);
    }

    // --- water: smooth, slightly glossy, gently translucent; matches inWater() exactly ---
    if(wmode){
      const water = new THREE.MeshPhongMaterial({
        color: wc, transparent:true, opacity:0.9, shininess:110,
        specular:0xbfeeff, emissive:new THREE.Color(wc).multiplyScalar(0.18)
      });
      // water surface sits just ABOVE the opaque ground disc so it isn't occluded (reads as shallows);
      // WY is tiny so the flat walking surface is effectively unchanged.
      const WY = 0.06;
      let wGeo;
      if(wmode==='pond'||wmode==='lake'){
        wGeo = new THREE.CircleGeometry(pondR, 40); wGeo.rotateX(-Math.PI/2);
        const wm = new THREE.Mesh(wGeo, water); wm.position.set(pondX, WY, pondZ); wm.renderOrder=1; groundGroup.add(wm); waterMesh=wm;
      } else if(wmode==='sea'){
        const len = WORLD_R*2.4;
        wGeo = new THREE.PlaneGeometry(WORLD_R*4, len, 24, 12); wGeo.rotateX(-Math.PI/2);
        const wm = new THREE.Mesh(wGeo, water); wm.position.set(0, WY, seaZ + len/2); wm.renderOrder=1; groundGroup.add(wm); waterMesh=wm;
      } else if(wmode==='stream'){
        // diagonal band along the line x+z=0 (perp half-width 3 -> width ~4.24)
        wGeo = new THREE.PlaneGeometry(4.24, WORLD_R*3.2, 6, 40); wGeo.rotateX(-Math.PI/2);
        const wm = new THREE.Mesh(wGeo, water); wm.rotation.y = Math.PI/4; wm.position.set(0,WY,0); wm.renderOrder=1; groundGroup.add(wm); waterMesh=wm;
      }
      // stash the un-rippled base heights so the frame-tail ripple can animate cheaply
      if(waterMesh){ const wp=waterMesh.geometry.attributes.position; waterMesh.userData.baseY=Float32Array.from(wp.array); }
    }
  }
  function inWater(x,z){ const w=waterInfo; if(!w||!w.mode) return false;
    if(w.mode==='pond'||w.mode==='lake') return Math.hypot(x-w.pondX,z-w.pondZ) < w.pondR+0.8;
    if(w.mode==='sea') return z > w.seaZ-0.8;
    if(w.mode==='stream') return Math.abs(x+z) < 3.8;
    return false; }
  function randPos(margin){
    let x,z,t=0; margin = margin||3;
    do { x=(Math.random()*2-1)*(WORLD_R-margin); z=(Math.random()*2-1)*(WORLD_R-margin); t++; }
    while(inWater(x,z) && t<30);
    return [x,z];
  }

  // register a decor group so the frame-tail wind gently sways it (pivots from its base at y=0)

  const GREENS = [0x4fae4b,0x57bd50,0x63c95a,0x46a848,0x3f9e46,0x6cce62];
  function makeTree(x,z){
    const g = new THREE.Group();
    const s = 0.8 + Math.random()*0.55;
    const trunkH = 3.4*s, trunkW = 0.55*s;
    const bark = [0x8a5a2b,0x7d5127,0x936239][Math.floor(Math.random()*3)];
    g.add(part('robe', bark, 0, trunkH/2, 0, trunkW, trunkH, trunkW));      // tapered trunk
    // soft rounded canopy: clustered spheres in gentle green tints
    const cy = trunkH + 0.7*s, tint = ()=>GREENS[Math.floor(Math.random()*GREENS.length)];
    g.add(sph(tint(), 0, cy, 0, 1.9*s));
    g.add(sph(tint(), 1.15*s, cy-0.35*s, 0.2*s, 1.25*s));
    g.add(sph(tint(), -1.0*s, cy-0.2*s, -0.35*s, 1.35*s));
    g.add(sph(tint(), 0.15*s, cy+0.95*s, 0.1*s, 1.15*s));
    g.add(sph(tint(), -0.2*s, cy-0.15*s, 1.05*s, 1.15*s));
    g.position.set(x,0,z); g.rotation.y=Math.random()*TAU;
    windify(g, 0.03); decor.add(g); return g;
  }
  function makeRock(x,z,s){
    const g = new THREE.Group();
    const tints=[0x9098a0,0x848c94,0xa2a8ae,0x7b838b];
    const m=new THREE.Mesh(ugeo('boulder'), flatMat(tints[Math.floor(Math.random()*tints.length)]));
    m.scale.set(1.7*(.8+Math.random()*.5), 1.15*(.8+Math.random()*.5), 1.5*(.8+Math.random()*.5));
    m.rotation.set(Math.random()*.5, Math.random()*TAU, Math.random()*.5);
    m.position.y=0.42; m.castShadow=true; m.receiveShadow=true; g.add(m);
    if(Math.random()<0.5){ const m2=new THREE.Mesh(ugeo('blob'), flatMat(tints[Math.floor(Math.random()*tints.length)]));
      m2.scale.setScalar(0.7+Math.random()*0.5); m2.position.set((Math.random()-.5)*1.6,0.28,(Math.random()-.5)*1.6);
      m2.rotation.set(Math.random(),Math.random()*TAU,Math.random()); m2.castShadow=true; m2.receiveShadow=true; g.add(m2); }
    g.scale.multiplyScalar(s||1); g.position.set(x,0,z); decor.add(g); return g;
  }
  function makeFlower(x,z){
    // lean 3-mesh flower (stem + flattened petal-ring + center) — tiny & numerous, so keep it cheap
    const g=new THREE.Group();
    const stemH=.45+Math.random()*.45;
    g.add(part('cylinder',0x4aa84e,0,stemH/2,0,.07,stemH,.07));
    const col=[0xff7ab8,0xffd21a,0xff8c3a,0xff6a6a,0xb98be6,0xfff2f6][Math.floor(Math.random()*6)];
    g.add(part('torus',col,0,stemH+.02,0,.62,.62,.62,-Math.PI/2));           // petal ring, laid flat
    g.add(sph(0xffe08a,0,stemH+.06,0,.13));                                   // sunny center
    g.traverse(o=>{ if(o.isMesh) o.castShadow=false; });   // tiny + numerous: skip shadow casting (perf)
    g.position.set(x,0,z); g.rotation.y=Math.random()*TAU; windify(g,0.05); decor.add(g); return g;
  }
  function makePalm(x,z){
    const g=new THREE.Group();
    const seg=5, H=5.2, sw=H/seg;
    for(let i=0;i<seg;i++){ const y=i*sw+sw/2, lean=i*0.16;
      g.add(part('cylinder',0x9c6b3a, lean*0.6, y, 0, .42-.045*i, sw+0.08, .42-.045*i, 0,0,-0.055*i)); }
    const topX=0.16*(seg-1)*0.6, topY=H*0.98;
    for(let i=0;i<7;i++){ const p=pivotAt(topX,topY,0); p.rotation.y=i*TAU/7;
      const fr=sph(GREENS[i%GREENS.length], 1.5,-0.25,0, 1.6,.11,.42); fr.rotation.z=-0.18; p.add(fr); g.add(p); }
    g.add(sph(0x6b4a2b, topX+.22, topY-.28, .12, .19));                      // coconut
    g.add(sph(0x6b4a2b, topX-.18, topY-.24, -.14, .17));
    g.position.set(x,0,z); g.rotation.y=Math.random()*TAU; windify(g,0.02); decor.add(g); return g;
  }
  function makeCactus(x,z){
    const g=new THREE.Group();
    const col=0x3f9e46, col2=0x49ad50;
    g.add(part('capsule',col,0,1.5,0,1,1.5,1));                             // rounded main body
    [[-1,1.4],[1,1.85]].forEach(([dir,h])=>{
      const p=pivotAt(0,h,0);
      const elbow=part('capsule',col2, dir*0.45,0,0, .5,.42,.5, 0,0,Math.PI/2);
      const arm  =part('capsule',col2, dir*0.9,0.55,0, .48,.55,.48);
      p.add(elbow,arm); g.add(p);
    });
    g.add(sph(0xffd21a,0,3.05,0,.16));                                      // little bloom on top
    g.position.set(x,0,z); g.rotation.y=Math.random()*TAU; windify(g,0.02); decor.add(g); return g;
  }
  // a few drifting butterflies for a living, modern feel (persistent, never cleared)
  const butterflies = [];
  (function spawnButterflies(){
    const wingCols=[0xff8ec4,0xffd54a,0x7ec8ff,0xff9a5a,0xba8bff];

      g.userData={ wl, wr, ang:Math.random()*TAU, rad:5+Math.random()*10, spd:0.25+Math.random()*0.3,
                   cx:(Math.random()-.5)*14, cz:(Math.random()-.5)*14, h:1.6+Math.random()*1.4, ph:Math.random()*TAU };

  function scatterScenery(){
    swayers = [];                          // decor is cleared each mission; rebuild the sway list
    const env = currentEnv || {}, d = env.decor || 'forest';
    const nT=Math.round(WORLD_R*0.55), nR=Math.round(WORLD_R*0.4), nF=Math.round(WORLD_R*0.8);
    if(d==='desert'){
      for(let i=0;i<nR;i++){ const [x,z]=randPos(2); makeRock(x,z,0.7+Math.random()); }
      for(let i=0;i<Math.round(WORLD_R*0.28);i++){ const [x,z]=randPos(2); if(Math.hypot(x,z)>6) makeCactus(x,z); }
    } else if(d==='beach'){
      for(let i=0;i<Math.round(WORLD_R*0.45);i++){ const [x,z]=randPos(3); if(Math.hypot(x,z)>6 && !inWater(x,z)) makePalm(x,z); }
      for(let i=0;i<nR;i++){ const [x,z]=randPos(2); makeRock(x,z,0.5+Math.random()); }
    } else {
      for(let i=0;i<nT;i++){ const [x,z]=randPos(3); if(Math.hypot(x,z)>6) makeTree(x,z); }
      for(let i=0;i<nR;i++){ const [x,z]=randPos(2); makeRock(x,z,0.7+Math.random()); }
      for(let i=0;i<nF;i++){ const [x,z]=randPos(1); makeFlower(x,z); }
    }
  }

  // ================= CHARACTERS (rounded & lifelike, matching the smooth low-poly world) =================
  function makePlayer(){
    const g = new THREE.Group();
    const skin=0xf2c79a, tunic=0xdcbf82, belt=0x8a5a2b, hair=0x5a3921, sandal=0x7a4a26;
    const hipY=1.25, shoulderY=2.15, headY=2.78;

    // legs: pivots at the hip so the walk-cycle code can rotate them about X
    const legL = pivotAt(-.30, hipY, 0), legR = pivotAt(.30, hipY, 0);
    [legL,legR].forEach(p=>{
      p.add(capsuleHang(skin, 0, 0, 0, 1.10, .12));       // bare shin
      p.add(sph(sandal, 0, -1.10, .04, .15, .08, .17));    // sandal
    });
    g.add(legL, legR);

    // tunic / robe torso + rope belt
    g.add(part('robe', tunic, 0, (hipY+shoulderY)/2, 0, 1.05, shoulderY-hipY, 1.05));
    g.add(part('torus', belt, 0, hipY+.12, 0, .68,.68,.42, Math.PI/2,0,0));

    // arms: pivots at the shoulder
    const armL = pivotAt(-.62, shoulderY, 0), armR = pivotAt(.62, shoulderY, 0);
    [armL,armR].forEach(p=>{
      p.add(capsuleHang(tunic, 0, 0, 0, .82, .17));        // sleeve
      p.add(sph(skin, 0, -.82, 0, .17));                   // hand
    });
    g.add(armL, armR);

    // head — warm, kind little face
    const head = new THREE.Group(); head.position.set(0, headY, 0); g.add(head);
    head.add(sph(skin, 0,0,0, .40,.39,.40));
    head.add(sph(skin, -.40,-.02,0, .07,.09,.07), sph(skin, .40,-.02,0, .07,.09,.07)); // ears
    head.add(sph(0x2a2a2a, -.16,.05,.34, .045,.05,.035), sph(0x2a2a2a, .16,.05,.34, .045,.05,.035)); // eyes
    head.add(sph(0xf3a9a0, -.29,-.06,.27, .07,.05,.03), sph(0xf3a9a0, .29,-.06,.27, .07,.05,.03));   // rosy cheeks
    head.add(sph(0xb5695a, 0,-.16,.37, .07,.03,.025));     // gentle smile
    head.add(sph(hair, 0,.13,-.02, .43,.28,.43));          // hair cap
    head.add(sph(hair, 0,.03,.30, .30,.16,.20));           // little fringe

    g.userData = { legL, legR, armL, armR };
    return g;
  }

    });
    g.add(sph(bodyColor,0,bodyY,0,br[0],br[1],br[2]));

    o.frequency.setValueAtTime(f0,t); o.frequency.linearRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol||.45,t+.03); g.gain.exponentialRampToValueAtTime(.001,t+dur);

  function scheduleNote(){
    if(!musicOn || !audioCtx){ musicTimer=null; return; }
    const song=SONGS[songIdx], spb=60/song.tempo;
    if(noteIdx>=song.notes.length){ songIdx=(songIdx+1)%SONGS.length; noteIdx=0; musicTimer=setTimeout(scheduleNote,1400); return; }
    const parts=song.notes[noteIdx].split(':'), f=NOTE[parts[0]], dur=(+parts[1])*spb;
    if(f>0){ const t=audioCtx.currentTime;
      const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.85,t+.05); g.gain.exponentialRampToValueAtTime(.02,t+dur*.9);
      o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+dur+.05);
      const o2=audioCtx.createOscillator(), g2=audioCtx.createGain(); o2.type='triangle'; o2.frequency.value=f/2;   // soft low harmony
      g2.gain.setValueAtTime(.0001,t); g2.gain.linearRampToValueAtTime(.35,t+.05); g2.gain.exponentialRampToValueAtTime(.01,t+dur*.8);
      o2.connect(g2); g2.connect(musicGain); o2.start(t); o2.stop(t+dur+.05);

  function confettiBurst(n){
    const cols=['#ff5a5a','#ffd21a','#37c14a','#2a7de8','#ff6fb5','#9b4de8','#ff8c1a','#ffffff'];
    const layer=document.createElement('div'); layer.className='confetti';
    const parts=[], N=n||70, H=innerHeight+60;
    for(let i=0;i<N;i++){ const p=document.createElement('i'); p.style.left=(Math.random()*100)+'vw';
      p.style.background=cols[i%cols.length]; if(i%3===0)p.style.borderRadius='50%'; layer.appendChild(p);
      parts.push({el:p,y:-20-Math.random()*260,vy:3.4+Math.random()*3.4,rot:Math.random()*360,vr:(Math.random()-.5)*34}); }
    document.body.appendChild(layer);
    const start=performance.now(); let last=start;
    (function step(now){ const dt=Math.min(50,now-last)/16; last=now; let alive=0;
      for(const q of parts){ q.y+=q.vy*dt; q.rot+=q.vr*dt; q.el.style.transform='translateY('+q.y.toFixed(1)+'px) rotate('+q.rot.toFixed(0)+'deg)'; if(q.y<H)alive++; }
      if(alive>0 && now-start<5000) requestAnimationFrame(step); else layer.remove(); })(start);
  }

    const t=e.changedTouches?e.changedTouches[0]:e; stickId=e.changedTouches?t.identifier:'m';
    const r=stick.getBoundingClientRect(); stickCx=r.left+r.width/2; stickCy=r.top+r.height/2; stickMove(e); }
  function stickMove(e){ if(stickId===null)return; let t;
    if(e.changedTouches){ for(const tt of e.touches){ if(tt.identifier===stickId){t=tt;break;} } if(!t)return; } else t=e;
    let dx=t.clientX-stickCx, dy=t.clientY-stickCy; const max=52, d=Math.hypot(dx,dy);
    if(d>max){ dx=dx/d*max; dy=dy/d*max; } knob.style.transform='translate('+dx+'px,'+dy+'px)';
    inputVec.x=dx/max; inputVec.y=dy/max; }

  // ================= UPDATE LOOP =================
  const camTarget = new THREE.Vector3();
  function camSnap(){ const p=player.position; camera.position.set(p.x+16,20,p.z+16); camera.lookAt(p.x,1.5,p.z); }
  const clock = new THREE.Clock();

  function frame(dt){
    if(playing && player){
      // input: joystick + keys
      let ix=inputVec.x, iy=inputVec.y;
      if(keys['w']||keys['arrowup']) iy=-1; if(keys['s']||keys['arrowdown']) iy=1;
      if(keys['a']||keys['arrowleft']) ix=-1; if(keys['d']||keys['arrowright']) ix=1;
      const mag=Math.hypot(ix,iy);
      // camera looks from +X,+Z toward player => screen-up (iy<0) should move to -X,-Z.
      // basis: forward(screen up)=(-1,0,-1)/√2 ; right(screen right)=(1,0,-1)/√2
      const F=0.70710678;
      let mvx=0, mvz=0;
      // Gentle, kid-friendly control: a generous dead-zone so a light touch
      // doesn't move, and a calm top speed with ease-in so it's never twitchy.
      const DEAD=0.24, MAXSPEED=(AGE_SPEED[age]||5.6);   // two-speed feel: ease-in for slow, full push for fast — and scaled by age
      if(mag>DEAD){
        const nrm = Math.min(1,(mag-DEAD)/(1-DEAD));          // 0..1 past the dead-zone
        const nx=ix/mag, ny=iy/mag;                          // pure direction
        const fwd=-ny, rgt=nx;
        mvx = (-F*fwd) + (F*rgt);
        mvz = (-F*fwd) + (-F*rgt);
        const speed = MAXSPEED * nrm;
        player.position.x = clamp(player.position.x + mvx*speed*dt, -WORLD_R+1, WORLD_R-1);
        player.position.z = clamp(player.position.z + mvz*speed*dt, -WORLD_R+1, WORLD_R-1);
        // smooth turning (no instant snapping)
        const targetRot = Math.atan2(mvx, mvz);
        let dr = targetRot - player.rotation.y; while(dr>Math.PI)dr-=TAU; while(dr<-Math.PI)dr+=TAU;
        player.rotation.y += dr * Math.min(1, dt*9);
        // walk bob
        walkPhase += dt*11*nrm;
        const sw=Math.sin(walkPhase)*0.5;
        player.userData.legL.rotation.x=sw; player.userData.legR.rotation.x=-sw;
        player.userData.armL.rotation.x=-sw; player.userData.armR.rotation.x=sw;
        player.position.y = Math.abs(Math.sin(walkPhase))*0.12;
      } else {
        player.position.y *= 0.8;
      }
      // camera follow (fixed angle)
      camTarget.set(player.position.x+16, 20, player.position.z+16);
      camera.position.lerp(camTarget, 0.12);
      camera.lookAt(player.position.x, 1.5, player.position.z);

      checkMission();
      updateTimer();
      // idle + WANDERING animals (older ages: they roam, and teens' animals flee!)
      const t=performance.now()*0.001;
      const wsp=missionCtx?missionCtx.wander:0, fleeR=missionCtx?missionCtx.fleeR:0;
      critters.children.forEach(c=>{ const u=c.userData; if(u.caught) return;
        c.position.y = Math.abs(Math.sin(t*2+c.position.x))*0.06;
        if(wsp>0 && u.vx!==undefined){
          u.turnT-=dt; if(u.turnT<=0){ u.turnT=0.8+Math.random()*1.6; const a=Math.random()*TAU; u.vx=Math.cos(a); u.vz=Math.sin(a); }
          let dx=u.vx, dz=u.vz, sp=wsp;
          if(fleeR>0){ const ddx=c.position.x-player.position.x, ddz=c.position.z-player.position.z, d=Math.hypot(ddx,ddz);
            if(d<fleeR && d>0.1){ dx=ddx/d; dz=ddz/d; sp=wsp*1.9; } }   // bolt away from the player
          let nx=c.position.x+dx*sp*dt, nz=c.position.z+dz*sp*dt;
          if(Math.abs(nx)>WORLD_R-2||Math.abs(nz)>WORLD_R-2||inWater(nx,nz)){ u.vx=-u.vx; u.vz=-u.vz; }   // bounce off edges/water
          else { c.position.x=nx; c.position.z=nz; c.rotation.y=Math.atan2(dx,dz); }
        }
      });
      items.children.forEach(it=>{ it.rotation.y+=dt*1.6; it.position.y=Math.sin(t*2+it.userData.spin)*0.12; });
      if(missionCtx&&missionCtx.starObj){ missionCtx.starObj.rotation.y+=dt*0.7; }
      // followers trail behind player (Noah)
      if(missionCtx){ let prev=player.position, i=0;
        missionCtx.followers.forEach(f=>{ i++; const tx=prev.x - Math.sin(player.rotation.y)*2.0, tz=prev.z - Math.cos(player.rotation.y)*2.0;
          f.position.x += (tx-f.position.x)*0.12; f.position.z += (tz-f.position.z)*0.12;
          f.rotation.y = Math.atan2(player.position.x-f.position.x, player.position.z-f.position.z)||f.rotation.y;
          if(f.userData.hop>0){ f.position.y=Math.sin((0.9-f.userData.hop)/0.9*Math.PI)*0.6; f.userData.hop-=dt*2; } else f.position.y=0;   // happy hop!
          prev=f.position; }); }
    }
    clouds.children.forEach(c=>{ c.position.x+=dt*0.6; if(c.position.x>70)c.position.x=-70; });
    // ---- ambient "living world" motion (cheap; runs every frame) ----
    const T = clock.elapsedTime;
    // gentle wind sway on trees/plants (pivots from their base at y=0 — play area stays flat)
    for(let i=0;i<swayers.length;i++){ const s=swayers[i], a=s.userData;
      const w = Math.sin(T*1.1 + a.phase)*a.sway; s.rotation.z = w; s.rotation.x = w*0.4; }
    // soft water ripple (below y=0; keeps the flat walking surface untouched)
    if(waterMesh){ const p=waterMesh.geometry.attributes.position, b=waterMesh.userData.baseY;
      for(let v=0; v<p.count; v++){ const ix=v*3, x=b[ix], z=b[ix+2];
        p.array[ix+1] = b[ix+1] + Math.sin(x*0.6 + T*1.6)*0.05 + Math.cos(z*0.5 + T*1.2)*0.05; }
      p.needsUpdate = true; }
    // drifting, wing-flapping butterflies
    const lim = WORLD_R-1;
    for(let i=0;i<butterflies.length;i++){ const bf=butterflies[i], u=bf.userData;
      u.ang += u.spd*dt;
      let bx=u.cx+Math.cos(u.ang)*u.rad, bz=u.cz+Math.sin(u.ang)*u.rad;
      bx=clamp(bx,-lim,lim); bz=clamp(bz,-lim,lim);
      bf.position.set(bx, u.h+Math.sin(T*2+u.ph)*0.35, bz);
      bf.rotation.y = -u.ang;
      const flap=Math.sin(T*14+u.ph)*0.9; u.wl.rotation.z=flap; u.wr.rotation.z=-flap;
    }
  }
  function update(){
    const dt = Math.min(0.05, clock.getDelta());
    frame(dt);
    renderer.render(scene,camera);
    requestAnimationFrame(update);
  }
  // test/debug hooks — only exposed with ?debug in the URL, never in the shipped game
  if(/debug/.test(location.search)) window.__ba = {
    frame, render: ()=>renderer.render(scene,camera), input: inputVec,
    tp: (x,z)=>{ if(player){ player.position.x=x; player.position.z=z; } },
    animalPos: ()=>critters.children.filter(c=>c.userData.kind==='animal'&&!c.userData.caught).map(c=>[+c.position.x.toFixed(1),+c.position.z.toFixed(1)]),
    itemPos: ()=>items.children.map(c=>[+c.position.x.toFixed(1),+c.position.z.toFixed(1)]),
    goalPos: ()=>missionCtx&&missionCtx.goalObj?missionCtx.goalObj.position.toArray().map(n=>+n.toFixed(1)):null,
    specialPos: ()=>missionCtx&&missionCtx.special?missionCtx.special.position.toArray().map(n=>+n.toFixed(1)):null,
    state: ()=>({ pos: player?player.position.toArray().map(n=>+n.toFixed(2)):null,
      collected: missionCtx?missionCtx.collected:0, target: missionCtx?missionCtx.target:0,
      playing, won, animalsLeft: critters.children.filter(c=>c.userData.kind==='animal'&&!c.userData.caught).length })
  };

  const popCheer=document.getElementById('popCheer'), timerEl=document.getElementById('timer');
  function cheer(txt){ popCheer.textContent=txt; popCheer.classList.remove('show'); void popCheer.offsetWidth; popCheer.classList.add('show'); }
  function updateTimer(){
    if(!missionCtx || !missionCtx.timeLimit){ timerEl.style.display='none'; return; }
    const rem=Math.max(0, missionCtx.timeLimit-(performance.now()-missionCtx.t0)/1000);
    if(rem<=0 && !missionCtx.overtime){ missionCtx.overtime=true; say('Time’s up — but keep going, you can still finish! 💪'); cheer('Keep going! 💪'); }
    timerEl.style.display='block';
    timerEl.textContent='⏱️ '+Math.floor(rem/60)+':'+String(Math.floor(rem%60)).padStart(2,'0');
    timerEl.classList.toggle('warn', rem<=10 && rem>0);
  }
  function catchAnimal(a){
    a.userData.caught=true; a.userData.hop=0.9; missionCtx.collected++; missionCtx.followers.push(a);
    sfxPick(); if(a.userData.type) sfxAnimal(a.userData.type);   // 🐑 the animal cries out!
    spark(a.position.x, a.position.z);
    updateGoal();
    const now=performance.now();
    missionCtx.combo = (now - missionCtx.comboT < 2600) ? missionCtx.combo+1 : 1;
    missionCtx.comboT = now;
    if(missionCtx.collected>=missionCtx.target){
      const where=mission.reachLabel||'the ark ⛵'; say('You got them all! Lead them to '+where,4000); cheer('All caught! 🎉');
      speak((mission.id==='noah'?'Amazing '+who()+'! Now lead them all to the ark!':'Wonderful '+who()+'! Now bring them to Adam!'));
    } else {
      if(missionCtx.combo>=2){ cheer('Combo x'+missionCtx.combo+'! 🔥'); sfxCombo(Math.min(missionCtx.combo,6)); }
      if(missionCtx.collected===Math.ceil(missionCtx.target/2)){ say('Halfway there, '+who()+'! 💪'); }
      else if(missionCtx.collected%2===0){ say((missionCtx.target-missionCtx.collected)+' more to go! 🐾'); }
    }
  }
  function spark(x,z){ const g=new THREE.Group();
    for(let i=0;i<6;i++){ const b=box(.2,.2,.2,0xffe14d, (Math.random()-.5),1+Math.random(),(Math.random()-.5)); g.add(b); }
    g.position.set(x,0,z); world.add(g); let t=0;
    (function up(){ t+=0.05; g.children.forEach(c=>{c.position.y+=0.06; c.scale.multiplyScalar(0.92);}); if(t<0.6)requestAnimationFrame(up); else world.remove(g); })();
  }

  function checkMission(){
    const p=player.position;
    if(mission.type==='gather'){
      const CR=AGE_CATCH[age]||2.0;
      critters.children.forEach(a=>{ if(!a.userData.caught && Math.hypot(p.x-a.position.x,p.z-a.position.z)<CR) catchAnimal(a); });
      if(missionCtx.collected>=missionCtx.target && missionCtx.goalObj){
        if(Math.hypot(p.x-missionCtx.goalObj.position.x, p.z-missionCtx.goalObj.position.z)<4.5) winMission();
      }
    } else if(mission.type==='collect'){
      items.children.slice().forEach(it=>{ if(Math.hypot(p.x-it.position.x,p.z-it.position.z)<1.9){
        items.remove(it); missionCtx.collected++; sfxPick(); spark(it.position.x,it.position.z); updateGoal();
        const now=performance.now(); missionCtx.combo=(now-missionCtx.comboT<2600)?missionCtx.combo+1:1; missionCtx.comboT=now;
        if(missionCtx.collected>=missionCtx.target) winMission();
        else { if(missionCtx.combo>=2){ cheer('Combo x'+missionCtx.combo+'! 🔥'); sfxCombo(Math.min(missionCtx.combo,6)); }
          if(missionCtx.collected===Math.ceil(missionCtx.target/2)) say('Halfway there, '+who()+'! 💪');
          else if(missionCtx.collected%3===0) say((missionCtx.target-missionCtx.collected)+' more! ✨'); } } });
    } else if(mission.type==='find'){
      const s=missionCtx.special; if(s){ const d=Math.hypot(p.x-s.position.x,p.z-s.position.z);
        const now=performance.now();
        if(now > (missionCtx.nextHint||0)){ missionCtx.nextHint = now + 3200;   // repeatable warmer/colder guidance
          if(d<8) say('So close — the lamb is right nearby! 🔥');
          else if(d<16) say('Getting warmer! Keep going! 🐑');
          else say('Keep exploring to find the lost lamb! ❄️'); }
        if(d<2.4) winMission(); }
    } else if(mission.type==='reach'){
      if(Math.hypot(p.x-missionCtx.goalObj.position.x, p.z-missionCtx.goalObj.position.z)<4.5) winMission();
    }
  }

  let won=false;
  function winMission(){
    if(won) return; won=true; playing=false;
    timerEl.style.display='none';
    const stars = (missionCtx.timeLimit && missionCtx.overtime) ? 2 : 3;   // beat the clock for all 3
    const p=progress(); p[mission.id]=Math.max(p[mission.id]||0, stars); saveProgress(p);
    sfxWin(); confettiBurst(110);
    const nm=(playerName&&playerName.trim())?', '+playerName.trim():'';
    const wh=document.querySelector('#winCard .winH'); if(wh) wh.textContent='🎉 You did it'+nm+'!';
    document.getElementById('winName').textContent = mission.emoji+' '+mission.name;
    document.getElementById('winVerse').textContent = mission.verse;
    const starsEl=document.getElementById('winStars'); starsEl.textContent='☆☆☆';
    document.getElementById('winCard').classList.add('show');
    const praise=['Great job!','You are amazing!','Way to go!','God is so proud of you!','Fantastic!'][Math.floor(Math.random()*5)];
    const beat=(missionCtx.timeLimit && !missionCtx.overtime)?' You beat the clock!':'';
    speak('Hooray '+who()+'! You finished '+mission.name+'!'+beat+' '+praise);
    let shown=0; const reveal=()=>{ if(shown>=stars)return; starsEl.textContent='⭐'.repeat(shown+1)+'☆'.repeat(2-shown);
      starsEl.style.transform='scale(1.35)'; setTimeout(()=>starsEl.style.transform='scale(1)',150); sfxStar(shown); shown++; setTimeout(reveal,430); };
    setTimeout(reveal,350);
  }

  // ================= SCREENS / NAV =================
  function hideScreens(){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show')); }
  function showScreen(id){ hideScreens(); document.getElementById(id).classList.add('show'); document.body.className=''; playing=false; }

  const nameInput=document.getElementById('nameInput');
  function nameKey(a){ return 'ba_name_'+a; }
  function loadName(){ try{ return localStorage.getItem(nameKey(age))||''; }catch(e){ return ''; } }
  function renderAges(){ const box=document.getElementById('ages'); box.innerHTML='';
    AGES.forEach(a=>{ const b=document.createElement('button'); b.className='ageChip'+(a.k===age?' sel':'');
      b.textContent='Age '+a.n; b.onclick=()=>{ age=a.k; try{localStorage.setItem('ba_age',age);}catch(e){}
        playerName=loadName(); nameInput.value=playerName; renderAges(); }; box.appendChild(b); }); }
  try{ age=localStorage.getItem('ba_age')||'Age6'; }catch(e){}
  playerName=loadName(); nameInput.value=playerName;
  nameInput.addEventListener('input',()=>{ playerName=nameInput.value; try{localStorage.setItem(nameKey(age), playerName);}catch(e){} });

  function renderMap(){
    document.getElementById('gemCount').textContent='⭐ '+totalStars();
    const list=document.getElementById('missionList'); list.innerHTML='';
    MISSIONS.forEach((m,i)=>{ const unlocked=isUnlocked(i), got=starsFor(m.id);
      const c=document.createElement('button'); c.className='mCard '+(got>0?'done ':'')+(unlocked?'':'locked');
      c.innerHTML='<div class="mIcon">'+(unlocked?m.emoji:'🔒')+'</div><div class="mBody"><div class="mName">'+m.name+'</div>'
        +'<div class="mGoalTxt">'+m.goal+'</div><div class="mStars">'+(got>0?'⭐⭐⭐':(unlocked?'Tap to play!':'Finish the last one first'))+'</div></div>';
      if(unlocked) c.onclick=()=>{ won=false; startMission(i); };
      list.appendChild(c); });
  }
  function openMap(){ showScreen('mapScreen'); renderMap(); }

  document.getElementById('playBtn').onclick=()=>{ initAudio(); openMap(); };
  document.getElementById('mapBack').onclick=()=>showScreen('startScreen');
  document.getElementById('backBtn').onclick=()=>{ won=false; openMap(); };
  document.getElementById('winMap').onclick=()=>{ document.getElementById('winCard').classList.remove('show'); won=false; openMap(); };
  document.getElementById('winNext').onclick=()=>{ document.getElementById('winCard').classList.remove('show');
    const ni=(missionCtx.index+1); if(ni<MISSIONS.length && isUnlocked(ni)){ won=false; startMission(ni); } else { won=false; openMap(); } };
  const vChip=document.getElementById('voiceChip');
  function syncVoice(){ vChip.textContent = voiceOn?'🔊 Voice: On':'🔇 Voice: Off'; }
  syncVoice();
  vChip.onclick=()=>{ voiceOn=!voiceOn; try{localStorage.setItem('ba_voice',voiceOn?'1':'0');}catch(e){} if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel(); syncVoice(); if(voiceOn)speak('Voice is on!'); };
  const mChip=document.getElementById('musicChip');
  function syncMusic(){ mChip.textContent = musicOn?'🎵 Music: On':'🔇 Music: Off'; }
  syncMusic();
  mChip.onclick=()=>{ musicOn=!musicOn; try{localStorage.setItem('ba_music',musicOn?'1':'0');}catch(e){} syncMusic(); if(musicOn) playMusic(); else stopMusic(); };

  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  // unlock audio on first tap
  ['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,()=>{ initAudio(); playMusic(); },{passive:true,once:false}));

  renderAges();
  update();
})();
</script>
</body>
